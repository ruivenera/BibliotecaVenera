<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1A1C">
<title>Venera</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icone-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400;9..144,600;9..144,700&family=Spectral:ital,wght@0,300;0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --tinta:      #0E1A1C;
    --tinta-2:    #14262A;
    --tinta-3:    #1E353B;
    --papel:      #E9E5D8;
    --papel-fosco:#94A29E;
    --latao:      #C69749;
    --indigo:     #8091DC;
    --rust:       #C2604A;
    /* Sobe e desce. Verde-sálvia abafado para não destoar do papel; o rust já servia. */
    --sobe:       #7F9E72;
    --desce:      #C2604A;

    --display: "Fraunces", Georgia, serif;
    --leitura: "Spectral", Georgia, serif;
    --meta:    "IBM Plex Mono", ui-monospace, monospace;

    --gap: 1.25rem;
    --raio: 3px;
    --seguro-baixo: env(safe-area-inset-bottom, 0px);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--tinta);
    color: var(--papel);
    font-family: var(--leitura);
    font-size: 17px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow-wrap: break-word;
  }

  :focus-visible {
    outline: 2px solid var(--latao);
    outline-offset: 2px;
    border-radius: 2px;
  }

  a { color: inherit; }

  /* ------------------------------------------------------------ tipografia */

  .rotulo {
    font-family: var(--meta);
    font-size: 0.66rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--papel-fosco);
  }

  .titulo-grande {
    font-family: var(--display);
    font-weight: 600;
    font-variation-settings: "SOFT" 20, "WONK" 1;
    font-size: clamp(1.5rem, 6vw, 2rem);
    line-height: 1.12;
    letter-spacing: -0.015em;
    margin: 0.35rem 0 0;
  }

  /* ----------------------------------------------------------------- topo */

  .topo {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.85rem var(--gap);
    background: color-mix(in srgb, var(--tinta) 88%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--tinta-3);
  }

  .marca {
    font-family: var(--display);
    font-weight: 700;
    font-variation-settings: "WONK" 1;
    font-size: 1.05rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: none;
    border: 0;
    color: var(--papel);
    padding: 0;
    cursor: pointer;
  }

  .estado {
    font-family: var(--meta);
    font-size: 0.66rem;
    letter-spacing: 0.08em;
    color: var(--papel-fosco);
    display: flex;
    align-items: center;
    gap: 0.4rem;
    background: none;
    border: 0;
    cursor: pointer;
  }
  .estado::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--papel-fosco);
  }
  .estado[data-estado="ligado"]::before { background: var(--latao); }
  .estado[data-estado="offline"]::before { background: var(--rust); }
  .estado[data-estado="a-sincronizar"]::before { animation: pulsar 1.1s ease-in-out infinite; }

  @keyframes pulsar { 50% { opacity: 0.25; } }

  /* ---------------------------------------------------------------- vistas */

  main { padding-bottom: calc(5rem + var(--seguro-baixo)); }

  .vista { display: none; }
  .vista[data-ativa="sim"] { display: block; animation: entrar 0.22s ease-out; }

  @keyframes entrar { from { opacity: 0; transform: translateY(6px); } }

  .seccao { padding: 1.5rem var(--gap) 0; }

  .cabecalho-seccao {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 0.85rem;
  }

  /* --------------------------------------------- estante (elemento âncora) */

  .estante {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    overflow-x: auto;
    padding: 0 var(--gap) 0.5rem;
    scrollbar-width: none;
    /* linha da prateleira */
    background:
      linear-gradient(to right, var(--tinta-3), var(--tinta-3)) 0 100% / 100% 2px no-repeat;
    min-height: 130px;
  }
  .estante::-webkit-scrollbar { display: none; }

  .lombada {
    flex: 0 0 auto;
    width: 27px;
    border: 0;
    border-radius: var(--raio) var(--raio) 0 0;
    padding: 0.5rem 0 0.55rem;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    flex-direction: column;
    cursor: pointer;
    color: var(--tinta);
    font-family: var(--meta);
    font-size: 0.6rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    transition: transform 0.18s ease, filter 0.18s ease;
    /* nervura de livro encadernado */
    background-image: linear-gradient(
      to right,
      rgba(0,0,0,0.22) 0 2px,
      transparent 2px calc(100% - 3px),
      rgba(0,0,0,0.14) calc(100% - 3px) 100%
    );
  }
  .lombada:hover, .lombada:focus-visible { transform: translateY(-5px); filter: brightness(1.12); }
  .lombada[data-hoje="sim"] { box-shadow: 0 0 0 1px var(--papel), 0 0 14px rgba(233,229,216,0.18); }

  .eixo-estante {
    display: flex;
    justify-content: space-between;
    padding: 0.5rem var(--gap) 0;
  }

  .legenda { display: flex; gap: 0.9rem; margin: 0; }
  .legenda span { display: inline-flex; align-items: center; gap: 0.35rem; }
  .legenda span::before {
    content: "";
    width: 7px; height: 7px;
    border-radius: 1px;
    background: var(--ponto);
  }

  /* ----------------------------------------------------------- cartões dia */

  .dossies { display: grid; gap: 0.85rem; }

  .dossie {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--tinta-2);
    border: 1px solid var(--tinta-3);
    border-left: 3px solid var(--marcador, var(--latao));
    border-radius: var(--raio);
    padding: 1rem 1.1rem 1.1rem;
    color: inherit;
    font: inherit;
    cursor: pointer;
    transition: border-color 0.18s ease, transform 0.18s ease;
  }
  .dossie:hover { border-color: var(--marcador, var(--latao)); transform: translateY(-2px); }

  .dossie h3 {
    font-family: var(--display);
    font-variation-settings: "SOFT" 20, "WONK" 1;
    font-weight: 600;
    font-size: 1.2rem;
    line-height: 1.2;
    margin: 0.4rem 0 0.5rem;
  }

  .dossie p { margin: 0; color: var(--papel-fosco); font-size: 0.95rem; line-height: 1.5; }

  .linha-meta {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-top: 0.75rem;
  }

  /* ------------------------------------------------------------- leitura */

  .leitura { padding: 1.25rem var(--gap) 0; max-width: 40rem; margin: 0 auto; }

  .resumo {
    font-size: 1.05rem;
    line-height: 1.55;
    color: var(--papel);
    border-left: 2px solid var(--tinta-3);
    padding-left: 1rem;
    margin: 1.1rem 0 2rem;
    font-style: italic;
  }

  .verbete { border-top: 1px solid var(--tinta-3); padding: 1.6rem 0; }

  .verbete h3 {
    font-family: var(--display);
    font-variation-settings: "SOFT" 20, "WONK" 1;
    font-weight: 600;
    font-size: 1.28rem;
    line-height: 1.22;
    margin: 0.55rem 0 0.7rem;
  }

  .verbete p { margin: 0 0 0.9rem; }

  .porque {
    font-family: var(--meta);
    font-size: 0.82rem;
    line-height: 1.55;
    color: var(--papel);
    background: var(--tinta-2);
    border-left: 2px solid var(--marcador, var(--latao));
    padding: 0.7rem 0.85rem;
    margin: 0 0 1rem;
  }
  .porque b {
    display: block;
    font-weight: 600;
    font-size: 0.66rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--marcador, var(--latao));
    margin-bottom: 0.25rem;
  }

  .impacto { display: inline-flex; align-items: center; gap: 0.3rem; }
  .impacto i { width: 9px; height: 3px; background: var(--tinta-3); display: block; }
  .impacto[data-nivel="baixo"] i:nth-child(1),
  .impacto[data-nivel="medio"] i:nth-child(-n+2),
  .impacto[data-nivel="alto"] i { background: var(--marcador, var(--latao)); }

  .fontes { display: flex; flex-wrap: wrap; gap: 0.45rem; margin: 0 0 1rem; }
  .fonte {
    font-family: var(--meta);
    font-size: 0.7rem;
    letter-spacing: 0.03em;
    color: var(--papel-fosco);
    text-decoration: none;
    border: 1px solid var(--tinta-3);
    border-radius: 2rem;
    padding: 0.2rem 0.6rem;
  }
  .fonte:hover { color: var(--papel); border-color: var(--papel-fosco); }

  /* ---------------------------------------------------------------- painel

     Traz a organização do relatório que ia por email — tabelas, medidor de
     risco, veredicto — mas na paleta da casa. Cada bloco só aparece se a
     edição o trouxer. */

  .painel { margin: 1.6rem 0 0.5rem; }

  .bloco { border-top: 1px solid var(--tinta-3); padding: 1.1rem 0; }
  .bloco > .rotulo { display: block; margin-bottom: 0.7rem; color: var(--papel-fosco); }

  .tabela { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  .tabela td { padding: 0.5rem 0; border-bottom: 1px solid var(--tinta-2); vertical-align: baseline; }
  .tabela tr:last-child td { border-bottom: 0; }
  .tabela .nome { font-weight: 600; white-space: nowrap; padding-right: 0.6rem; }
  .tabela .num {
    font-family: var(--meta);
    font-size: 0.82rem;
    text-align: right;
    white-space: nowrap;
    padding-left: 0.6rem;
  }
  .tabela .leitura { color: var(--papel-fosco); font-size: 0.85rem; padding-left: 0.9rem; }

  .var { font-family: var(--meta); font-size: 0.82rem; white-space: nowrap; }
  .var[data-sinal="sobe"]  { color: var(--sobe); }
  .var[data-sinal="desce"] { color: var(--desce); }
  .var[data-sinal="igual"] { color: var(--papel-fosco); }

  .destaque {
    border: 1px solid var(--tinta-3);
    border-left: 3px solid var(--marcador, var(--latao));
    padding: 0.9rem 1rem;
    margin-bottom: 0.9rem;
  }
  .destaque .topo { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
  .destaque .tick { font-family: var(--display); font-weight: 600; font-size: 1.2rem; }
  .destaque .desc { color: var(--papel-fosco); font-size: 0.8rem; }
  .destaque .texto { margin: 0.6rem 0 0; font-size: 0.92rem; }

  /* Medidor de risco: a barra é o dado, não enfeite — enche conforme o índice. */
  .medidor { display: flex; align-items: baseline; gap: 0.6rem; margin-bottom: 0.6rem; }
  .medidor .valor { font-family: var(--display); font-weight: 700; font-size: 2rem; line-height: 1; }
  .medidor .de { color: var(--papel-fosco); font-family: var(--meta); font-size: 0.75rem; }
  .barra { height: 4px; background: var(--tinta-3); margin-bottom: 0.8rem; }
  .barra i { display: block; height: 100%; background: var(--latao); }
  .barra[data-alto="1"] i { background: var(--rust); }

  .grelha { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.4rem 1.2rem; }
  .grelha div { display: flex; justify-content: space-between; gap: 0.5rem; padding: 0.3rem 0; border-bottom: 1px solid var(--tinta-2); }
  .grelha span:first-child { color: var(--papel-fosco); font-size: 0.85rem; }
  .grelha span:last-child { font-family: var(--meta); font-size: 0.8rem; text-align: right; }

  .duas { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
  .duas .rotulo { display: block; margin-bottom: 0.5rem; color: var(--papel-fosco); }
  .lista { margin: 0; padding-left: 1rem; font-size: 0.9rem; line-height: 1.5; }
  .lista li { margin-bottom: 0.4rem; }
  .lista[data-tom="bom"]::marker, .lista[data-tom="bom"] li::marker { color: var(--sobe); }
  .lista[data-tom="mau"] li::marker { color: var(--desce); }

  .veredicto { border: 1px solid var(--tinta-3); padding: 1rem; }
  .veredicto .tom {
    font-family: var(--display);
    font-weight: 700;
    font-size: 1.35rem;
    margin: 0.2rem 0 0.5rem;
  }
  .veredicto[data-tom="alta"]   .tom { color: var(--sobe); }
  .veredicto[data-tom="baixa"]  .tom { color: var(--desce); }
  .veredicto[data-tom="neutro"] .tom { color: var(--papel-fosco); }
  .veredicto p { margin: 0; font-size: 0.94rem; }

  /* Progresso do curso de IA. */
  .progresso { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 1rem 0 0; }
  .selo {
    font-family: var(--meta);
    font-size: 0.7rem;
    letter-spacing: 0.04em;
    color: var(--papel-fosco);
    border: 1px solid var(--tinta-3);
    border-radius: 2rem;
    padding: 0.2rem 0.6rem;
  }
  .selo b { color: var(--papel); font-weight: 600; }

  @media (max-width: 34rem) {
    .duas, .grelha { grid-template-columns: 1fr; }
    .tabela .leitura { display: none; }
  }

  /* --------------------------------------------------------------- botões */

  .accoes { display: flex; gap: 0.5rem; flex-wrap: wrap; }

  .btn {
    font-family: var(--meta);
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--papel);
    background: transparent;
    border: 1px solid var(--tinta-3);
    border-radius: var(--raio);
    padding: 0.55rem 0.9rem;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .btn:hover { border-color: var(--papel-fosco); background: var(--tinta-2); }
  .btn[data-tom="forte"] { background: var(--latao); border-color: var(--latao); color: var(--tinta); font-weight: 600; }
  .btn[data-tom="forte"]:hover { filter: brightness(1.08); background: var(--latao); }
  .btn[data-tom="perigo"] { color: var(--rust); border-color: color-mix(in srgb, var(--rust) 40%, transparent); }
  .btn:disabled { opacity: 0.4; cursor: default; }

  .btn-voltar {
    font-family: var(--meta);
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--papel-fosco);
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
  }
  .btn-voltar:hover { color: var(--papel); }

  /* ---------------------------------------------------------------- notas */

  .campo {
    width: 100%;
    background: var(--tinta);
    border: 1px solid var(--tinta-3);
    border-radius: var(--raio);
    color: var(--papel);
    font-family: var(--leitura);
    font-size: 1rem;
    line-height: 1.5;
    padding: 0.7rem 0.8rem;
    margin-bottom: 0.7rem;
  }
  .campo::placeholder { color: var(--papel-fosco); opacity: 0.7; }
  textarea.campo { resize: vertical; min-height: 7rem; }

  .lista-notas { display: grid; gap: 0.7rem; }

  .nota {
    background: var(--tinta-2);
    border: 1px solid var(--tinta-3);
    border-radius: var(--raio);
    padding: 0.85rem 1rem;
    cursor: pointer;
  }
  .nota:hover { border-color: var(--papel-fosco); }
  .nota h4 { font-family: var(--display); font-weight: 600; font-size: 1.02rem; margin: 0 0 0.3rem; }
  .nota p {
    margin: 0;
    font-size: 0.9rem;
    color: var(--papel-fosco);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* -------------------------------------------------------------- revisão */

  .cartao {
    background: var(--tinta-2);
    border: 1px solid var(--tinta-3);
    border-radius: var(--raio);
    padding: 1.6rem 1.3rem;
    min-height: 13rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
  }
  .cartao .frente { font-family: var(--display); font-weight: 600; font-size: 1.35rem; line-height: 1.25; }
  .cartao .verso {
    margin-top: 1.1rem;
    padding-top: 1.1rem;
    border-top: 1px solid var(--tinta-3);
    font-size: 0.98rem;
    text-align: left;
    line-height: 1.55;
    white-space: pre-wrap;
  }

  .notas-revisao { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4rem; margin-top: 0.9rem; }
  .notas-revisao .btn { padding: 0.7rem 0.2rem; font-size: 0.63rem; letter-spacing: 0.04em; }
  .notas-revisao .btn small { display: block; font-size: 0.58rem; opacity: 0.6; letter-spacing: 0; margin-top: 0.15rem; text-transform: none; }

  .barra { height: 2px; background: var(--tinta-3); margin-bottom: 1.1rem; }
  .barra i { display: block; height: 100%; background: var(--latao); transition: width 0.3s ease; }

  /* ---------------------------------------------------------------- vazio */

  .vazio {
    border: 1px dashed var(--tinta-3);
    border-radius: var(--raio);
    padding: 2rem 1.2rem;
    text-align: center;
    color: var(--papel-fosco);
  }
  .vazio strong {
    display: block;
    font-family: var(--display);
    font-weight: 600;
    font-size: 1.1rem;
    color: var(--papel);
    margin-bottom: 0.35rem;
  }
  .vazio p { margin: 0 0 1rem; font-size: 0.92rem; }
  .vazio p:last-child { margin-bottom: 0; }

  /* --------------------------------------------------------------- rodapé */

  .rodape {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 20;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    background: color-mix(in srgb, var(--tinta) 92%, transparent);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--tinta-3);
    padding-bottom: var(--seguro-baixo);
  }

  .aba {
    background: none;
    border: 0;
    border-top: 2px solid transparent;
    padding: 0.85rem 0.4rem;
    color: var(--papel-fosco);
    font-family: var(--meta);
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .aba[aria-current="page"] { color: var(--papel); border-top-color: var(--latao); }

  .conta {
    display: inline-block;
    min-width: 1.15rem;
    margin-left: 0.3rem;
    padding: 0 0.25rem;
    border-radius: 1rem;
    background: var(--rust);
    color: var(--tinta);
    font-size: 0.62rem;
    font-weight: 600;
  }
  .conta:empty, .conta[data-zero="sim"] { display: none; }

  /* ---------------------------------------------------------------- folha */

  dialog {
    width: min(34rem, 100%);
    margin: auto auto 0;
    background: var(--tinta-2);
    color: var(--papel);
    border: 1px solid var(--tinta-3);
    border-radius: var(--raio) var(--raio) 0 0;
    padding: 1.3rem var(--gap) calc(1.3rem + var(--seguro-baixo));
  }
  dialog::backdrop { background: rgba(6,12,13,0.72); }
  dialog h3 { font-family: var(--display); font-weight: 600; font-size: 1.15rem; margin: 0.4rem 0 1rem; }

  .aviso {
    font-family: var(--meta);
    font-size: 0.72rem;
    line-height: 1.5;
    color: var(--rust);
    margin: 0 0 0.8rem;
    min-height: 1.1rem;
  }

  .rodape-folha { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 0.5rem; margin-top: 0.3rem; }
  .rodape-folha #folha-para-cartao { margin-right: auto; }

  /* --------------------------------------------------------------- ecrã ↑ */

  @media (min-width: 46rem) {
    body { font-size: 18px; }
    .seccao, .leitura { padding-left: 2rem; padding-right: 2rem; }
    .estante { padding-left: 2rem; padding-right: 2rem; }
    .eixo-estante { padding-left: 2rem; padding-right: 2rem; }
    .dossies { grid-template-columns: 1fr 1fr; }
    .rodape { grid-template-columns: repeat(3, minmax(0, 10rem)); justify-content: center; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<header class="topo">
  <button class="marca" data-ir="estante">Venera</button>
  <button class="estado" id="estado" data-estado="parado" title="Sincronizar agora">a arrancar</button>
</header>

<main>

  <!-- ------------------------------------------------------- primeira vez -->
  <section class="vista" id="v-chave" aria-label="Ligar à biblioteca">
    <div class="seccao">
      <p class="rotulo">Primeira vez</p>
      <h1 class="titulo-grande">Liga a biblioteca</h1>
      <p style="color:var(--papel-fosco)">Cola a chave da app. Fica guardada neste aparelho, não a voltas a escrever.</p>
      <input class="campo" id="campo-chave" type="password" autocomplete="current-password" placeholder="chave da app" enterkeyhint="go">
      <p class="aviso" id="aviso-chave"></p>
      <button class="btn" data-tom="forte" id="btn-chave">Ligar</button>
    </div>
  </section>

  <!-- ------------------------------------------------------------ estante -->
  <section class="vista" id="v-estante" aria-label="Estante">
    <div class="seccao" style="padding-bottom:0.7rem">
      <div class="cabecalho-seccao" style="margin-bottom:0">
        <p class="rotulo">Estante</p>
        <p class="legenda rotulo">
          <span style="--ponto:var(--latao)">Finanças</span>
          <span style="--ponto:var(--indigo)">IA</span>
        </p>
      </div>
    </div>
    <div class="estante" id="estante"></div>
    <div class="eixo-estante">
      <span class="rotulo">hoje</span>
      <span class="rotulo">mais antigo →</span>
    </div>

    <div class="seccao">
      <div class="cabecalho-seccao">
        <p class="rotulo">Última edição</p>
        <span class="rotulo" id="data-hoje"></span>
      </div>
      <div class="dossies" id="dossies"></div>
    </div>
  </section>

  <!-- ------------------------------------------------------------ leitura -->
  <section class="vista" id="v-edicao" aria-label="Edição">
    <div class="leitura">
      <button class="btn-voltar" data-ir="estante">← Estante</button>
      <div id="edicao-cabecalho"></div>
      <div id="edicao-itens"></div>
    </div>
  </section>

  <!-- -------------------------------------------------------------- notas -->
  <section class="vista" id="v-notas" aria-label="Notas">
    <div class="seccao">
      <div class="cabecalho-seccao">
        <p class="rotulo">Notas</p>
        <button class="btn" id="btn-nota-nova">Nova nota</button>
      </div>
      <input class="campo" id="procura" type="search" placeholder="Procurar nas notas" enterkeyhint="search">
      <div class="lista-notas" id="lista-notas"></div>
    </div>
  </section>

  <!-- ------------------------------------------------------------ revisão -->
  <section class="vista" id="v-revisao" aria-label="Revisão">
    <div class="seccao">
      <div class="cabecalho-seccao">
        <p class="rotulo">Revisão</p>
        <span class="rotulo" id="progresso-revisao"></span>
      </div>
      <div class="barra"><i id="barra-revisao" style="width:0%"></i></div>
      <div id="palco-revisao"></div>
    </div>
  </section>

</main>

<nav class="rodape" aria-label="Secções">
  <button class="aba" data-ir="estante" aria-current="page">Estante</button>
  <button class="aba" data-ir="notas">Notas</button>
  <button class="aba" data-ir="revisao">Revisão<span class="conta" id="conta-revisao" data-zero="sim"></span></button>
</nav>

<dialog id="folha">
  <p class="rotulo" id="folha-rotulo"></p>
  <h3 id="folha-titulo"></h3>
  <input class="campo" id="folha-frente" placeholder="Frente">
  <textarea class="campo" id="folha-verso" placeholder="Verso"></textarea>
  <p class="aviso" id="folha-aviso"></p>
  <div class="rodape-folha">
    <button class="btn" id="folha-para-cartao" hidden>Fazer cartão</button>
    <button class="btn" id="folha-apagar" data-tom="perigo" hidden>Apagar</button>
    <button class="btn" id="folha-cancelar">Cancelar</button>
    <button class="btn" data-tom="forte" id="folha-guardar">Guardar</button>
  </div>
</dialog>

<script src="/app.js" type="module"></script>
</body>
</html>
